<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Class Attendance | Mercylife Training College ERP</title>
  <link rel="stylesheet" href="assets/css/style.css" />
  <script type="module" src="assets/js/theme.js"></script>
</head>
<body>

  <div class="app-container">
    <div id="sidebar-container"></div>

    <div class="main-wrapper">
      <div id="navbar-container"></div>

      <main class="content-area">
        <div class="card">
          <div class="card-header">
            <div>
              <h3 class="card-title">📅 Daily Lecture & Skills Lab Attendance Register</h3>
              <span class="card-subtitle">Mark daily student attendance for lectures and practical sessions</span>
            </div>
            <button class="btn btn-primary" id="save-attendance-btn">💾 Save Attendance Register</button>
          </div>

          <div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap:1rem; margin-bottom:1.25rem;">
            <div>
              <label class="form-label">Select Date</label>
              <input type="date" class="form-control" value="2026-07-30" />
            </div>
            <div>
              <label class="form-label">Unit Module</label>
              <select class="form-control">
                <option>ANA-101 - Human Anatomy & Histology</option>
                <option>PHY-102 - Medical Physiology</option>
                <option>NUR-201 - Fundamentals of Nursing</option>
              </select>
            </div>
            <div>
              <label class="form-label">Venue / Room</label>
              <input type="text" class="form-control" value="Anatomy Lab 2" readonly />
            </div>
          </div>

          <div class="table-responsive">
            <table class="table">
              <thead>
                <tr>
                  <th>Admission No</th>
                  <th>Student Name</th>
                  <th>Course Program</th>
                  <th>Attendance Status</th>
                  <th>Remarks / Excuse Notes</th>
                </tr>
              </thead>
              <tbody id="attendance-tbody">
                <tr><td colspan="5" style="text-align:center; padding:2rem;">Loading attendance register...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script type="module" src="assets/js/attendance.js"></script>
</body>
</html>
