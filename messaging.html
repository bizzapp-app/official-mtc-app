<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notices & Messaging | Mercylife Training College ERP</title>
  <link rel="stylesheet" href="assets/css/style.css" />
  <script type="module" src="assets/js/theme.js"></script>
</head>
<body>

  <div class="app-container">
    <div id="sidebar-container"></div>

    <div class="main-wrapper">
      <div id="navbar-container"></div>

      <main class="content-area">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem;">
          <div>
            <h2 style="font-size:1.5rem; font-weight:800; color:var(--text-main); margin:0;">📢 Campus Notice Board & Internal Messaging</h2>
            <span style="font-size:0.85rem; color:var(--text-muted);">Official announcements, exam timetables, and department notices</span>
          </div>
          <button class="btn btn-primary" id="post-notice-btn">📢 Post New Notice</button>
        </div>

        <div id="notices-container" style="display:flex; flex-direction:column; gap:1.25rem;">
          <div style="padding:2rem; text-align:center;">Loading announcements...</div>
        </div>
      </main>
    </div>
  </div>

  <script type="module" src="assets/js/messaging.js"></script>
</body>
</html>
